[PatchGroups]
; Increase the night-vision render target from 512x256 to 2048x1024.
NVGResolution=1

; Compute screen-width/screen-height values used by dynamic resolution hooks.
DynamicResolution=1

; Use the dynamic resolution values when centering and reading the mouse cursor.
MouseCursorFix=1

; Use the current resolution instead of fixed 640x480 bounds for ClipCursor.
ClipCursorFix=1

[Recovery]
; Restore the last cursor clipping rectangle after the game regains focus.
RestoreCursorClip=1
RestoreCursorClipDelayMs=250
; Prefer WM_DISPLAYCHANGE confirmation before restoring, with a timed fallback.
WaitForDisplayChange=1

[Debug]
; Writes patch application messages to the debugger with OutputDebugStringA.
LogAppliedPatches=0
