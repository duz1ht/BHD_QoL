[PatchGroups]
; Run D3D8 windowed and cover the monitor without a window frame.
BorderlessFullscreen=1

; Preserve and stretch the in-game resolution at 0; use the desktop resolution at 1.
; Ignored when BorderlessFullscreen=0.
ForceDesktopResolution=1

; Corrects the first-person FOV for the internal render resolution's aspect ratio.
UseCorrectAspectFOV=1

; Use System DPI awareness so window, cursor, and monitor coordinates share one scale.
DPIAware=1

; Uses the Windows Raw Input mouse interface for compatibility with modern systems and newer devices.
RawMouseInput=1

; Samples an independent Raw Input stream once per rendered camera frame while
; preserving the original authoritative input cadence.
FreeRateMousePoll=1

; Drives normal on-foot first-person visual yaw/pitch at render frequency without
; reproducing the game's persistent authoritative yaw filter.
HighRateCameraRotation=1

; Corrects legacy fixed-point rounding in mouse sensitivity scaling, mainly noticeable with sniper scopes.
MouseScalingFix=1

; Adapt screen-center calculations to the current resolution.
AdaptiveScreenCenter=1

; Use the current resolution instead of fixed 640x480 bounds for ClipCursor.
ScaleCursorClipToResolution=1

; Restore confinement to the game client after focus, display, or window changes.
; Independent from RawMouseInput; leave enabled to prevent multi-monitor cursor escape.
RestoreCursorClip=1

[Logging]
; Creates a new BHD_QoL_<date>_<time>_<pid>.log beside dfbhd.exe for every session.
Enabled=0

; Frequency of aggregated Raw Input movement and cursor-confinement diagnostics.
RawInputStatisticsIntervalMs=5000
