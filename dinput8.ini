[PatchGroups]
; Increase the night-vision render target from 512x256 to 2048x1024.
NVGResolution=1

; Compute screen-width/screen-height values used by dynamic resolution hooks.
DynamicResolution=1

; Use the current resolution instead of fixed 640x480 bounds for ClipCursor.
ClipCursorFix=1

; Use WM_INPUT relative mouse reports instead of legacy cursor-position messages.
; Disabled by default until the target executable and local bindings are validated.
RawMouseInput=0

[Logging]
; Creates a new BHD_QoL_<date>_<time>_<pid>.log beside dfbhd.exe for every session.
Enabled=1

; Frequency of aggregated Raw Input movement and cursor-confinement diagnostics.
RawInputStatisticsIntervalMs=5000
