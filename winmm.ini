[PatchGroups]
; Run D3D8 windowed and cover the monitor without a window frame.
BorderlessFullscreen=1

; Preserve and stretch the in-game resolution at 0; use the desktop resolution at 1.
; Ignored when BorderlessFullscreen=0.
ForceDesktopResolution=1

; Corrects the first-person FOV for the internal render resolution's aspect ratio.
UseCorrectAspectFOV=1

; Use System DPI awareness so window, cursor, and monitor coordinates share one scale.
DPIAware=1

; Detect each loaded FNT0 file's atlas size independently (256 through 4096).
; Accepts mixed square power-of-two, 32-bit pages; does not generate new fonts.
AllowHighResolutionFonts=1

; Uses Windows Raw Input for relative movement. Buttons and wheel keep native handling.
RawMouseInput=1

; Applies Raw Input movement that arrived after the latest simulation update to the
; first-person presentation camera. The simulation, aiming and networking remain native.
HighFrequencyCamera=1

; Smooths on-foot first-person camera XYZ between native movement updates.
; Reduces stepping of static scenery while strafing/diagonally walking.
; Independent from RawMouseInput and HighFrequencyCamera; adds up to one movement
; update of visual position lag (normally 4 ms, or 16 ms on the slow path).
HighFrequencyCameraPosition=1

; Makes the first-person weapon and hands follow the presentation-camera yaw and pitch.
; Also follows the smoothed position when HighFrequencyCameraPosition=1.
; Requires HighFrequencyCamera=1 or HighFrequencyCameraPosition=1.
HighFrequencyViewmodel=1

; Corrects legacy fixed-point rounding in mouse sensitivity scaling, mainly noticeable with sniper scopes.
MouseScalingFix=1

; Makes bare "mousescale" report the current value without increasing it.
MouseScaleQueryFix=1

; Adapt screen-center calculations to the current resolution.
AdaptiveScreenCenter=1

; Use the current resolution instead of fixed 640x480 bounds for ClipCursor.
ScaleCursorClipToResolution=1

; Restore confinement to the game client after focus, display, or window changes.
; Independent from RawMouseInput; leave enabled to prevent multi-monitor cursor escape.
RestoreCursorClip=1

